name: Release Marionette

# Builds the Marionette package (marionette-v<version>) when its version changes on main or on manual dispatch, and
# opens its release pull request in acaprino/marionette, the package's own public repository: the build goes as
# the folder marionette/, with its notes in releases/<tag>.md, to the branch release/<tag>, and that repository
# opens the pull request into main. Merging it publishes the release there. Run again before the merge, it
# refreshes the same pull request. The push uses MARIONETTE_DEPLOY_KEY, a write deploy key of acaprino/marionette.
# The factory and its desktop app (muro-v<version>) are released by release.yml at every merge of develop into
# main. See AGENTS.md, "Releasing".
on:
  push:
    # Compare the two manifest versions directly, including when a large merge changes hundreds of paths.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MANIFEST: examples/marionette/sources.json
  PACKAGE_REPOSITORY: acaprino/marionette

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        name: Check the version and published tags
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
          fi
          python3 .github/scripts/marionette_release.py

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    concurrency:
      group: release-marionette-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      PKG_VERSION: ${{ needs.plan.outputs.version }}
      PKG_TAG: marionette-v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test the release commit
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Validate, check sources and build
        run: |
          python muro_build.py --manifest "$MANIFEST" --validate
          python muro_build.py --manifest "$MANIFEST" --check-sources
          python muro_build.py --manifest "$MANIFEST" --build --out "$RUNNER_TEMP/release"
      # checkout keeps the deploy key for the git commands run in `package`, the push below included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PACKAGE_REPOSITORY }}
          ssh-key: ${{ secrets.MARIONETTE_DEPLOY_KEY }}
          path: package
      - name: Push the build to the release branch
        working-directory: package
        run: |
          branch="release/$PKG_TAG"
          provenance="Built by Muro from $GITHUB_REPOSITORY@$GITHUB_SHA."
          # An earlier run may have prepared or published this version while this build was queued.
          published=$(git ls-remote --tags origin "refs/tags/$PKG_TAG")
          if [ -n "$published" ]; then
            echo "$PKG_TAG is already published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(git ls-remote --heads origin "refs/heads/$branch")
          head=${existing%%$'\t'*}
          if [ -n "$head" ]; then
            git fetch --no-tags --depth=1 origin "$head"
            previous=$(git show -s --format=%b "$head")
            if [ "$previous" = "$provenance" ]; then
              pulls=$(curl --fail --silent --show-error --get "$GITHUB_API_URL/repos/$PACKAGE_REPOSITORY/pulls" \
                --data-urlencode state=open --data-urlencode base=main --data-urlencode "head=${PACKAGE_REPOSITORY%/*}:$branch")
              number=$(jq -r '.[0].number // empty' <<< "$pulls")
              if [ -n "$number" ]; then
                echo "Already prepared in https://github.com/$PACKAGE_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          git switch -c "$branch"
          rm -rf marionette
          cp -a "$RUNNER_TEMP/release/marionette" marionette
          mkdir -p releases
          notes="$GITHUB_WORKSPACE/docs/releases/$PKG_TAG.md"
          {
            if [ -f "$notes" ]; then cat "$notes"; echo; else printf '# Marionette %s\n\n' "$PKG_VERSION"; fi
            echo "Built by Muro from $GITHUB_REPOSITORY@$GITHUB_SHA ($MANIFEST)."
          } > "releases/$PKG_TAG.md"
          git add -A marionette releases
          if git diff --cached --quiet; then
            echo "$PKG_TAG is already on the package main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Marionette $PKG_VERSION" -m "$provenance"
          git push --force-with-lease="refs/heads/$branch:$head" origin "$branch"
          echo "Pushed $branch to $PACKAGE_REPOSITORY; its pull request opens at https://github.com/$PACKAGE_REPOSITORY/pulls" >> "$GITHUB_STEP_SUMMARY"
