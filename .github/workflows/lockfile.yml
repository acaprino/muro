# TEMPORARY: makes package-lock.json and Cargo.lock for the branch refresh (nothing is resolved on the owner's machine) and
# keeps them as the artifact `locks`. Deleted with the commit of the locks.
name: Lockfile
on:
  push:
    branches: [refresh]
    paths: ['.github/workflows/lockfile.yml']
permissions:
  contents: read
jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve the npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Resolve Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null
      - run: git diff --stat -- Cargo.lock package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locks
          path: |
            package-lock.json
            Cargo.lock
          retention-days: 1
          if-no-files-found: error
