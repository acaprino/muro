# TEMPORARY. This workflow exists only to make package-lock.json once, because npm is never run on the owner's machine
# (AGENTS.md, "Nothing is compiled on this machine"). `--package-lock-only --ignore-scripts` resolves versions and runs
# no dependency's script. It writes nothing to the repository: it uploads the lockfile as the artifact `package-lock`
# (`gh run download`), which is committed by hand. Delete this file once the lockfile is committed.
name: Lockfile

on:
  push:
    branches: [sigrid-6.15.1]
    paths: ['.github/workflows/lockfile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve the lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload the lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
