# TEMPORARY: makes package-lock.json for the branch refresh (npm is never run on the owner's machine) and keeps it as the
# artifact `package-lock`. Deleted with the commit of the lockfile.
name: Lockfile
on:
  push:
    branches: [refresh]
    paths: ['.github/workflows/lockfile.yml']
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Resolve the lockfile
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error
