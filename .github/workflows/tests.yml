name: Tests

# Muro's own tests run here, not on a developer machine (owner rule of 2026-11-17): see AGENTS.md, "Changes and
# verification". Muro has no tests on Marionette (owner rule of 2026-11-22): the Python tests that name it, and its
# validation, source check, build and default-project pack, are in marionette.yml, so a problem of the package (an
# upstream that moved) cannot fail this workflow or, through it, a release of Muro.
#
# Triggers and cache as in the CI standard of all the repositories: the push to develop, the pull requests to develop and
# by hand (`gh workflow run tests.yml --ref <branch>`); never the develop -> main release pull request or main, whose
# commit the push to develop already verified.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test
        # tests/conftest.py marks every test module that names Marionette; marionette.yml runs those.
        run: |
          python -m pip install pytest
          python -m pytest -q -rf --tb=short -m "not marionette"

  # The desktop app: the job above builds none of it. Windows, because the app is
  # Windows-first and its start-with-Windows tests write the per-user Run key.
  desktop:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cargo cache key
        id: cargo-key
        run: |
          $info = rustc -vV
          if ($LASTEXITCODE) { exit 1 }
          $release = ($info | Select-String '^release: (\S+)').Matches[0].Groups[1].Value
          $commit = ($info | Select-String '^commit-hash: (\w{9})').Matches[0].Groups[1].Value
          $pins = Select-String -Path Cargo.lock -Pattern '^(source|checksum) = ' | ForEach-Object Line
          $lock = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($pins -join "`n"))).Substring(0, 20).ToLower()
          "toolchain=$release-$commit" >> $env:GITHUB_OUTPUT
          "lock=$lock" >> $env:GITHUB_OUTPUT
      - name: Restore the compiled Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-desktop-${{ steps.cargo-key.outputs.toolchain }}-${{ steps.cargo-key.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-${{ steps.cargo-key.outputs.toolchain }}-
      - name: Rust tests
        run: cargo test --locked -p muro-registry -p muro-desktop-runtime
      - name: Frontend unit tests
        if: always()
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
      - name: Design rules
        if: always()
        run: npx imago-check
      - name: Type check
        if: always()
        run: npx tsc --noEmit
      - name: Frontend build
        if: always()
        run: npm run build
      # Nothing above compiles the shell (src-tauri), where the tray, the background worker and the
      # waiting for the registry live. It embeds the frontend build just made, and its resources
      # folder is staged by hand and not in Git: the build script refuses a missing one, so an empty
      # one stands in.
      - name: Shell tests
        if: always()
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          cargo test --locked -p muro-desktop
      # Headless Edge through Playwright's msedge channel; the runner image ships Edge: there is no browser to cache.
      - name: Browser tests
        if: always()
        run: node apps/desktop/tests/browser.mjs
      - name: Screenshots of the browser tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-screenshots
          path: apps/desktop/tests/artifacts/*.png
          retention-days: 7
          if-no-files-found: warn
