name: Tests

# The full suite and the package checks run here, not on a developer machine
# (owner rule of 2026-11-17): see AGENTS.md, "Changes and verification".
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MANIFEST: examples/marionette/sources.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install pytest
          python -m pytest -q -rf --tb=short
      - name: Validate, check sources and build
        if: always()
        run: |
          python muro_build.py --manifest "$MANIFEST" --validate
          python muro_build.py --manifest "$MANIFEST" --check-sources
          python muro_build.py --manifest "$MANIFEST" --build --out "$RUNNER_TEMP/stage"
      # The default project, packed from its real sources (fetched at their pins) with the release just built,
      # on every push: a release of Marionette must not be the first time it is packed (ADR-0028). The size of
      # the file and what reading it costs (the first read unpacks it, the second finds it unpacked) are printed.
      - name: Pack the default project
        if: always()
        run: |
          python -m muro project pack --manifest "$MANIFEST" --out "$RUNNER_TEMP/marionette.mp" --sources-cache "$RUNNER_TEMP/sources-cache" --release "$RUNNER_TEMP/stage"
          echo "marionette.mp: $(stat -c %s "$RUNNER_TEMP/marionette.mp") bytes"
          time python -m muro project info --summary "$RUNNER_TEMP/marionette.mp" --cache "$RUNNER_TEMP/project-cache"
          time python -m muro project info --summary "$RUNNER_TEMP/marionette.mp" --cache "$RUNNER_TEMP/project-cache" > /dev/null

  # The desktop app: the job above builds none of it. Windows, because the app is
  # Windows-first and its start-with-Windows tests write the per-user Run key.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Rust tests
        run: cargo test --locked -p muro-registry -p muro-desktop-runtime
      - name: Frontend unit tests
        if: always()
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
      - name: Design rules
        if: always()
        run: npx imago-check
      - name: Type check
        if: always()
        run: npx tsc --noEmit
      - name: Frontend build
        if: always()
        run: npm run build
      # Nothing above compiles the shell (src-tauri), where the tray, the background worker and the
      # waiting for the registry live. It embeds the frontend build just made, and its resources
      # folder is staged by hand and not in Git: the build script refuses a missing one, so an empty
      # one stands in.
      - name: Shell tests
        if: always()
        run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/resources | Out-Null
          cargo test --locked -p muro-desktop
      # Headless Edge through Playwright's msedge channel; the runner image ships Edge.
      - name: Browser tests
        if: always()
        run: node apps/desktop/tests/browser.mjs
