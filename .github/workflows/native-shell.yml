# TEMPORARY. native-shell.mjs on a program already built (the artifact of a Tests run); deleted once it passes there.
name: Native shell

on:
  push:
    branches: [imago-shell]
    paths: ['.github/workflows/native-shell.yml', 'apps/desktop/tests/native-shell.mjs']

permissions:
  contents: read
  actions: read

jobs:
  shell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45608339560 -n muro-desktop -D release
          npm ci
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name Muro.exe -Value '--remote-debugging-port=0' -Force | Out-Null
          $env:MURO_DESKTOP_EXE = "$PWD/release/Muro.exe"
          node apps/desktop/tests/native-shell.mjs
