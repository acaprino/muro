name: Marionette

# Marionette's own checks, apart from Muro's: the Python tests that name it (marked `marionette` by tests/conftest.py),
# and what a release of it needs, run on the same commit: the manifest validated, its pinned sources checked
# against their remotes, the package built, and its project file packed from the real sources with that build.
# Owner rule of 2026-11-22: Muro has no tests on Marionette. A problem here (a source that moved, a pin that no
# longer matches) fails only this workflow; neither `Tests` nor `Release` (release.yml) depends on it, and Muro's
# release does not build Marionette: it takes the release that release-marionette.yml published. Its release
# gate is release-marionette.yml and is not changed. Runs when what Marionette is made of changes, or by hand
# (`gh workflow run marionette.yml --ref <branch>`).
on:
  push:
    paths:
      - examples/marionette/**
      - muro/**
      - prompts/**
      - muro_build.py
      - pyproject.toml
      - tests/**
      - docs/adr/**
      - docs/releases/**
      - .github/scripts/marionette_release.py
      - .github/workflows/marionette.yml
      - .github/workflows/release-marionette.yml
  pull_request:
    paths:
      - examples/marionette/**
      - muro/**
      - prompts/**
      - muro_build.py
      - pyproject.toml
      - tests/**
      - docs/adr/**
      - docs/releases/**
      - .github/scripts/marionette_release.py
      - .github/workflows/marionette.yml
      - .github/workflows/release-marionette.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marionette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marionette:
    runs-on: ubuntu-latest
    env:
      MANIFEST: examples/marionette/sources.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install pytest
          python -m pytest -q -rf --tb=short -m marionette
      - name: Validate, check sources and build
        if: always()
        run: |
          python muro_build.py --manifest "$MANIFEST" --validate
          python muro_build.py --manifest "$MANIFEST" --check-sources
          python muro_build.py --manifest "$MANIFEST" --build --out "$RUNNER_TEMP/stage"
      # Its project file (`muro project pack`, ADR-0028), packed from its real sources (fetched at their pins) with
      # the release just built, on every run: a release of Marionette must not be the first time it is packed. The size of
      # the file and what reading it costs (the first read unpacks it, the second finds it unpacked) are printed.
      - name: Pack the project file
        if: always()
        run: |
          python -m muro project pack --manifest "$MANIFEST" --out "$RUNNER_TEMP/marionette.mp" --sources-cache "$RUNNER_TEMP/sources-cache" --release "$RUNNER_TEMP/stage"
          echo "marionette.mp: $(stat -c %s "$RUNNER_TEMP/marionette.mp") bytes"
          time python -m muro project info --summary "$RUNNER_TEMP/marionette.mp" --cache "$RUNNER_TEMP/project-cache"
          time python -m muro project info --summary "$RUNNER_TEMP/marionette.mp" --cache "$RUNNER_TEMP/project-cache" > /dev/null
