# TEMPORARY, for the branch no-classes: the page alone (no Rust), in two jobs, so that a push is read in minutes. Deleted with the last commit of the branch.
name: Pages (throwaway)
on:
  push:
    branches: [no-classes]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  page:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        part: [tests, shots]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - if: matrix.part == 'tests'
        run: npx tsc --noEmit
      - if: ${{ !cancelled() && matrix.part == 'tests' }}
        run: npm test
      - if: ${{ !cancelled() && matrix.part == 'tests' }}
        run: npx --no sigrid-check apps/desktop/src
      - if: ${{ !cancelled() && matrix.part == 'tests' }}
        run: npx vite build --config apps/desktop/vite.config.ts
      - if: ${{ !cancelled() && matrix.part == 'tests' }}
        run: |
          Remove-Item apps/desktop/tests/artifacts/*.png -ErrorAction SilentlyContinue
          node apps/desktop/tests/browser.mjs
      - if: ${{ !cancelled() && matrix.part == 'tests' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-tests
          path: apps/desktop/tests/artifacts/*.png
          retention-days: 2
          if-no-files-found: warn
      - if: matrix.part == 'shots'
        run: node apps/desktop/tests/shots.mjs
      - if: ${{ !cancelled() && matrix.part == 'shots' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-shots
          path: apps/desktop/tests/shots/*.png
          retention-days: 2
          if-no-files-found: warn
