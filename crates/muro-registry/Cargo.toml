[package]
name = "muro-registry"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
tempfile = "3"
url = "2"
percent-encoding = "2"
serde_yaml = "0.9"
toml = "1"

[dev-dependencies]

# The stand-in for the Codex CLI that tests/service.rs runs (CARGO_BIN_EXE_fake-codex); no program of Muro.
[[bin]]
name = "fake-codex"
path = "tests/bin/fake_codex.rs"
test = false
doc = false

[[bin]]
name = "fake-hermes"
path = "tests/bin/fake_hermes.rs"
test = false
doc = false
