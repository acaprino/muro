[package]
name = "muro-desktop"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
imago-shell = { git = "https://github.com/acaprino/imago", tag = "v1.2.0" }
anyhow = "1"
tauri = { version = "2.9", features = ["tray-icon"] }
# The native open-file dialog (`pick_file`); Tauri 2 has none in its core. Only its Rust API is used: no
# permission of the plugin is granted to the page, so the window cannot call it itself.
tauri-plugin-dialog = "2.8"
serde_json = "1"
muro-registry = { path = "../../../crates/muro-registry" }
muro-desktop-runtime = { path = "../../../crates/muro-desktop-runtime" }

[features]
custom-protocol = ["tauri/custom-protocol"]
