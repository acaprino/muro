<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muro demo data</title><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/smooth.css"></head><body><div id="app"></div><script type="module">
// Demo data for the documentation screenshots (tests/screenshots.mjs). Read-only: nothing is saved.
// ?state=empty shows first use: one harness and no plugins.
import {mountApp} from '/src/app.ts';
const at=t=>String(1795046400+t*60); // minutes after 2026-11-19 00:00 UTC
const empty=new URLSearchParams(location.search).get('state')==='empty';
const home='C:/Users/you';
const targets=[
 {id:'claude',harness:'claude-code',name:'Claude Code',root:home+'/.claude',executable:'claude',enabled:true,exclusive:true},
 {id:'codex',harness:'codex',name:'Codex',root:home+'/.codex',executable:'codex',enabled:true,exclusive:false},
 {id:'opencode',harness:'opencode',name:'OpenCode',root:home+'/.config/opencode',executable:'opencode',enabled:true,exclusive:false},
];
const build=(harness,version,origin='native')=>({harness,path:`${home}/Muro/data/artifacts/${harness}-${version}`,version,origin});
const plugins=[
 {id:'marionette',name:'Marionette',source:'github.com/acaprino/marionette',policy:'stable',pinned_version:'',targets:['claude','codex','opencode'],distributions:[build('claude-code','0.4.0'),build('codex','0.4.0'),build('opencode','0.4.0')],upstream_version:'v0.4.0',upstream_revision:'7ded288c0d1e4a51',last_checked:at(560)},
 {id:'commit-helper',name:'commit-helper',source:'github.com/example/commit-helper',policy:'stable',pinned_version:'',targets:['claude','codex'],distributions:[build('claude-code','2.1.0'),build('codex','2.1.0')],upstream_version:'v2.1.0',upstream_revision:'3f9a0c1b77e2d410',last_checked:at(560)},
 {id:'test-runner',name:'test-runner',source:'github.com/example/test-runner',policy:'pinned',pinned_version:'1.0.4',targets:['opencode'],distributions:[build('opencode','1.0.4')],upstream_version:'v1.0.4',upstream_revision:'b21e04d9a8c3f617',last_checked:at(540)},
 {id:'docs-writer',name:'docs-writer',source:'github.com/example/docs-writer',policy:'stable',pinned_version:'',targets:['claude','opencode'],distributions:[build('claude-code','1.2.0')],upstream_version:'v1.2.0',upstream_revision:'e5c7a93f0b14d2c8',last_checked:at(545)},
 {id:'sql-companion',name:'sql-companion',source:'github.com/example/sql-companion',policy:'head',pinned_version:'',targets:[],distributions:[]},
];
const installed=(id,version,managed=true)=>({id,registry_id:managed?id:undefined,name:id==='marionette'?'Marionette':id,version,path:`${home}/plugins/${id}`,managed});
const inventory=[
 {target_id:'claude',complete:true,supported:true,error:null,plugins:[installed('marionette','0.3.0'),installed('commit-helper','2.1.0'),installed('docs-writer','1.2.0'),installed('old-snippets','0.2.0',false)]},
 {target_id:'codex',complete:true,supported:true,error:null,plugins:[installed('marionette','0.4.0'),installed('commit-helper','2.1.0')]},
 {target_id:'opencode',complete:true,supported:true,error:null,plugins:[installed('marionette','0.4.0')]},
];
const jobs=[{id:'job-1',plugin_id:'docs-writer',harness:'opencode',status:'running',phase:'harmonization',budget_usd:2,log_path:`${home}/Muro/data/jobs/job-1/log.txt`,message:'Claude Code is adapting the plugin for OpenCode.',time:at(566)}];
const activity=[
 {id:'a1',time:at(500),action:'apply',status:'complete',message:'3 operations applied. Inventory refreshed.'},
 {id:'a2',time:at(560),action:'resolve',status:'complete',message:'Marionette: upstream v0.4.0, native builds for Claude Code, Codex and OpenCode.'},
 {id:'a3',time:at(566),action:'adapt',status:'started',message:'docs-writer for OpenCode, budget $2.'},
];
const instructions=plugins.map(p=>({plugin_id:p.id,path:`${home}/Muro/data/custom-instructions/${p.id}`,files:p.id==='marionette'?['recap-adhd.md']:[],digest:'demo',stale_harnesses:[]}));
const snapshot=empty
 ?{registry:{schema:1,revision:1,plugins:[],targets:[targets[0]],settings:{auto_sync:false,interval_minutes:60,agent:'claude-code',python:'python',factory_path:''}},inventory:[{...inventory[0],plugins:[]}],activity:[],jobs:[],custom_instructions:[]}
 :{registry:{schema:1,revision:12,plugins,targets,settings:{auto_sync:true,interval_minutes:60,agent:'claude-code',python:'python',factory_path:''}},inventory,activity,jobs,custom_instructions:instructions};
// Harnesses not managed yet come first, so the screenshot shows what Manage with Muro is for.
const discovered=[['pi','Pi','0.9.1'],['hermes','Hermes Agent','0.7.0'],['deepseek','DeepSeek','1.3.0'],['claude-code','Claude Code','2.1.4'],['codex','Codex','0.58.0'],['opencode','OpenCode','1.4.2']].map(([harness,name,version])=>({harness,name,executable:`${home}/.local/bin/${harness}.exe`,version,session_root:null,available:true,supported:harness!=='deepseek'}));
const plan={id:'plan-demo',revision:12,blockers:[],operations:[
 {target_id:'claude',plugin_id:'marionette',name:'Marionette',kind:'update',from_version:'0.3.0',to_version:'0.4.0',reason:'Reconcile desired artifact'},
 {target_id:'opencode',plugin_id:'test-runner',name:'test-runner',kind:'install',from_version:'',to_version:'1.0.4',reason:'Missing desired distribution'},
 {target_id:'claude',plugin_id:'',name:'old-snippets',kind:'remove',from_version:'0.2.0',to_version:'',reason:'Not in desired registry for this target'},
]};
const request=async(action,payload={})=>{
 if(action==='discover')return structuredClone(empty?discovered.filter(d=>d.harness==='claude-code'):discovered);
 if(action==='plan')return structuredClone(plan);
 if(action==='jobs')return structuredClone(snapshot.jobs);
 if(action==='custom_instructions'||action==='open_custom_instructions')return structuredClone(snapshot.custom_instructions.find(i=>i.plugin_id===payload.id));
 return structuredClone(snapshot);
};
mountApp(document.querySelector('#app'),request);
</script></body></html>
