<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muro UI test fixture</title><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/smooth.css"></head><body><div id="app"></div><script type="module">
import {mountApp} from '/src/app.ts';
const snapshot={registry:{schema:1,revision:1,plugins:[],targets:[{id:'t1',harness:'codex',name:'Codex isolated test',root:'D:/isolated/codex',executable:'codex',enabled:true,exclusive:false}],settings:{auto_sync:false,interval_minutes:60,agent:'claude-code',python:'python',factory_path:''}},inventory:[{target_id:'t1',complete:true,error:null,supported:true,plugins:[]}],activity:[]};
window.calls=[];window.rejectSave=false;window.blockPlan=false;window.instructionFiles=[];window.instructionStale=false;
const request=async(action,payload={})=>{window.calls.push({action,payload});if(action==='discover')return [{harness:'codex',name:'Codex',executable:'codex',version:'test',config_root:'D:/config/codex',available:true,supported:true}];if(action==='save_plugin'){if(window.rejectSave)throw Error('Version conflict: reload registry');snapshot.registry.plugins=[payload.plugin];if(!window.seededMetadata){snapshot.registry.plugins[0].upstream_version='v-native';snapshot.registry.plugins[0].upstream_revision='abc123';snapshot.registry.plugins[0].distributions[0].origin='muro';snapshot.registry.plugins[0].distributions[0].custom_instructions_digest='old-instructions';window.seededMetadata=true;}snapshot.registry.revision++;}if(action==='save_target'){snapshot.registry.targets.push(payload.target);snapshot.registry.revision++;}if(action==='plan')return {id:'plan-test',revision:snapshot.registry.revision,operations:[{target_id:'t1',plugin_id:snapshot.registry.plugins[0]?.id,name:'Test plugin',kind:'install',from_version:'',to_version:'1',reason:'Missing'}],blockers:window.blockPlan?['Inventory incomplete']:[]};if(action==='apply'){snapshot.activity.push({id:'a1',time:'2026-11-15',action:'apply',status:'success',message:'Applied test plan'});}snapshot.custom_instructions=snapshot.registry.plugins.map(p=>({plugin_id:p.id,path:p.custom_instructions_dir||'D:/isolated/data/custom-instructions/'+p.id,files:window.instructionFiles,digest:'fixture-digest',stale_harnesses:window.instructionStale?['codex']:[]}));if(action==='open_custom_instructions')return snapshot.custom_instructions.find(p=>p.plugin_id===payload.id);return structuredClone(snapshot);};
mountApp(document.querySelector('#app'),request);
</script></body></html>
