<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muro desktop: redesign proposal (prototype)</title>
<!--
SCREEN AND STATE MAP (written before the screens)

Two jobs, two places. PROJECTS is where a plugin is made. SYNC is where plugins reach the harnesses.

Title bar   logo | tabs Projects, Sync, Activity, Settings | sync state with last check -> sync | X -> notification area
projects    list of projects (file .mp, version, inputs, state, installs) -> project
            Marionette is the default project: Muro always ships with it (owner, 2026-11-19), also at first run
            "Installed as published": plugins with no project -> Create a project -> dialog newproject
            New project -> dialog newproject | Open project file -> file picker (simulated)
project     header: name, version, state, file path, what the .mp file holds (owner, 2026-11-19: all the metadata:
            the final plugin's name, its history, the plugins that compose it, the choices made, and its reference Git
            repository: address, branch, release tags; author, dates and a changelog, which Muro also writes by itself;
            decision records the AI keeps, which the author can edit; the file carries everything, input copies
            and built plugin included, so it works offline).
            Four numbered steps:
  1 inputs      source plugins and skills: pin, license, what each became -> step 2 filtered
                new release found -> Move pin (project needs harmonizing) | Add input -> dialog input
  2 harmonize   state and reason | Harmonize -> dialog harmonize (budget) -> run with phases, Cancel -> new version
                four views: Decision records (why, dated, by Muro; Edit / Add a record -> dialog record; a record of the
                author is binding (owner, 2026-11-19): the project then needs harmonizing, the run receives it and the
                record shows since which version) | Choices by part | History | Prompts
                choices made (the delivery decisions, filter by input and by form) | history: every run with its version,
                what changed and its files | prompts
  3 graph       decision graph: entries -> capabilities, conditional needs, conflicts; capability -> dialog cap
                simulator: documented example -> ordered plan and highlighted branch | own text -> says what the app would do
  4 install     switch per harness, installed version, last check | Apply this project's changes -> sheet review
sync        state strip, always there: state, last check, last sync, next check | Check now | Review -> sheet review | Apply all
            matrix plugin x harness: latest version, cell = installed version or pending change
            column header: harness name -> sheet harness; state line, "Sync N changes" -> sheet review of that harness
            installed but not in the list: Leave alone / Always uninstall, Add to my list
            Add harness (found ones, by hand, rescan) | Add plugin -> dialog plugin
activity    running harmonization (phases, Cancel), filter All / Sync / Harmonization / Problems
settings    Sync rule, Background (automatic sync, interval, start with Windows, keep in notification area),
            Appearance, Harmonization (agent, Python, factory), Maintenance. Saved on change.
window      X -> hidden to the notification area (first time: system notification), or quit when the switch is off
tray        icon -> menu: Open Muro, Sync now, Pause automatic sync, Quit -> "not running" -> Start Muro
setup       first run, 3 steps: harnesses -> import what is installed -> background sync

State (one object, saved to localStorage on every render)
  win, page, setup, settings, lastCheck, lastSync
  targets [{id, harness, name, root, exe, enabled, exclusive, checked, synced, installed{plugin: version}, unlisted[]}]
  plugins [{id, name, kind project|native, source, policy, pinned, upstream, targets[], builds{harness:{v, origin}},
            proj {file, scope, extra[], dirty[], runs[{id, t, status, version, budget}]}}]
  pins {source: release}, updates {source: release found}, jobs [{id, plugin, budget, status, phase, t}], activity[]
  ui {proj, step, q, filter, afilter, dsrc, dform, sim, dialog {kind, arg}, hinted}, drafts {dialogKey: values}
Derived, never stored: cell(plugin, target), plan() = operations + blockers, projState(project).
Real data: the Marionette project (17 inputs, 85 decisions, 37 capabilities, 15 entries, 25 examples) is read from
examples/marionette of this repository. Faked: every backend call is a setTimeout; nothing touches this computer.
-->
<style>
:root{
  --bg:#12161e;--panel:#1a202c;--raised:#222a38;--line:#2a3240;--line-strong:#6b7488;
  --text:#e8ecf3;--muted:#9aa5b8;--good:#8bd9b0;--warn:#edc48a;--bad:#ffa5b9;
  --accent:#c1a3ff;--primary:#c1a3ff;--primary-hover:#d2bcff;--on-primary:#1c102e;
  --scrim:#0a0d12b3;--shadow:0 16px 48px #00000066;--desk:#0a0c11;
  --r-sm:6px;--r:8px;--r-lg:12px;
  --wash:color-mix(in srgb,var(--text) 4%,transparent);--wash-hover:color-mix(in srgb,var(--text) 9%,transparent);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f7f9;--panel:#ffffff;--raised:#eceef2;--line:#e3e6ea;--line-strong:#7b8494;
  --text:#111827;--muted:#566070;--good:#0f6f47;--warn:#8a5a00;--bad:#b3261e;
  --accent:#6a3fc4;--primary:#6a3fc4;--primary-hover:#5a33ad;--on-primary:#ffffff;
  --scrim:#11182766;--shadow:0 16px 48px #1118272e;--desk:#c9ced8;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,fieldset{margin:0;padding:0}
fieldset{border:0;min-width:0}
ul,ol{list-style:none}
h1{font-size:22px;font-weight:600;letter-spacing:-.2px}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
small{font-size:12px;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.55}
:is(button,input,select,textarea,summary,a,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
code,.mono{font:12px/1.5 "Cascadia Code",Consolas,monospace}
.muted{color:var(--muted)}.grow{flex:1;min-width:0}.nowrap{white-space:nowrap}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--accent)}

/* frame */
.stage{height:100vh;display:grid;grid-template-rows:minmax(0,1fr) 44px}
.window{display:grid;grid-template-rows:44px minmax(0,1fr);background:var(--bg);position:relative;overflow:hidden}
.titlebar{display:flex;align-items:center;gap:16px;padding-left:12px;border-bottom:1px solid var(--line);user-select:none}
.tlogo{height:28px;width:84px;object-fit:contain;flex:none}
.tstatus{margin-left:auto;display:flex;align-items:center;height:30px;padding:0 10px;border-radius:var(--r-sm);font-size:12px;color:var(--muted);white-space:nowrap}
.tstatus:hover{background:var(--wash-hover);color:var(--text)}
.appico{width:16px;height:16px;border-radius:4px;background:var(--primary);color:var(--on-primary);font:700 10px/16px "Segoe UI",sans-serif;text-align:center}
.titlebar .x{width:46px;height:43px;display:grid;place-items:center;color:var(--text)}
.titlebar .x:hover{background:#c42b1c;color:#fff}
.away{display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;color:var(--muted);padding:24px}
.away strong{color:var(--text);font-size:16px}
.taskbar{display:flex;align-items:center;gap:8px;padding:0 12px;background:color-mix(in srgb,var(--panel) 92%,#000);border-top:1px solid var(--line);font-size:12px;position:relative}
.taskbar .proto{color:var(--muted);margin-right:4px}
.tray{margin-left:auto;display:flex;align-items:center;gap:10px}
.trayico{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;position:relative}
.trayico:hover{background:var(--wash-hover)}
.trayico b{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%;background:var(--good);border:1px solid var(--panel)}
.trayico b.pending{background:var(--warn)}
.traymenu{position:absolute;right:56px;bottom:50px;top:auto!important;width:250px;z-index:30}
.osnote{position:absolute;right:12px;bottom:54px;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:2px;z-index:25}

/* shell */
#app{display:grid;min-height:0}
nav{display:flex;gap:2px}
nav button{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:500}
nav button:hover{background:var(--wash-hover);color:var(--text)}
nav button[aria-current="page"]{background:var(--raised);color:var(--text);font-weight:600}
nav .n{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:7px}
.dot.pending{background:var(--warn)}
.main{overflow:auto;padding:24px 28px 28px;min-width:0}
.page{max-width:1180px;margin:0 auto}
.narrow{max-width:860px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.ph p{color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin:26px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:12px;font-weight:600;color:var(--muted);background:var(--raised);border-radius:10px;padding:1px 8px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--wash);font-weight:600;white-space:nowrap;transition:background .2s ease}
.btn:hover:not(:disabled){background:var(--wash-hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 12%,transparent)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.iconbtn{width:30px;height:30px;border-radius:var(--r-sm);display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--wash-hover);color:var(--text)}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;border-radius:4px}
.switch{width:38px;height:22px;border-radius:11px;background:var(--line-strong);position:relative;flex:none;transition:background .2s ease}
.switch i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"] i{transform:translateX(16px);background:var(--on-primary)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);padding:2px;gap:2px;background:var(--wash)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:4px 11px;border-radius:4px;color:var(--muted);font-weight:500;white-space:nowrap}
.seg input:checked+span{background:var(--raised);color:var(--text);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
input:not([type=checkbox],[type=radio]),select,textarea{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);min-width:0}
textarea{height:auto;padding:8px 10px;resize:vertical;width:100%}
input[aria-invalid="true"]{border-color:var(--bad)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);margin:0;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:var(--raised);color:var(--muted);white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tag.accent{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
button.tag{text-decoration:underline;text-underline-offset:2px}
button.tag:hover{filter:brightness(1.15)}
.mk{width:24px;height:24px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font:700 10px/24px "Segoe UI",sans-serif;text-align:center;flex:none;display:inline-block}
.sym{width:32px;height:32px;border-radius:var(--r);background:var(--raised);font:700 12px/32px "Segoe UI",sans-serif;text-align:center;flex:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
kbd{font:11px "Segoe UI",sans-serif;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.strip{display:flex;align-items:center;gap:10px;padding:12px 14px 12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:18px;flex-wrap:wrap}
.strip>div{display:grid;gap:1px;flex:1 1 320px}
.strip .sico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--raised);margin-right:4px}
.strip.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.strip.accent .sico{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.strip.warn .sico{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.strip.good .sico{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.strip .meta{margin-top:5px;display:flex;flex-wrap:wrap;gap:2px 18px}
.strip .meta b{font-weight:600;color:var(--text)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--muted);width:240px}
.search:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.search input{border:0;background:none;height:auto;padding:0;flex:1;outline:0;color:var(--text)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th .mk{margin-right:8px;vertical-align:middle}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--wash)}
.hcol{display:flex;align-items:center;gap:6px;min-height:24px}
.hstate{margin-top:6px;min-height:26px;display:flex;align-items:center;gap:6px;font-weight:400}
.hbtn{display:inline-flex;align-items:center;font:inherit;font-weight:600;color:var(--muted);padding:3px 8px 3px 3px;margin:-3px 0 -3px -3px;border-radius:var(--r-sm)}
.hbtn:hover{background:var(--wash-hover);color:var(--text)}
.pbtn{display:flex;align-items:center;gap:10px;width:100%;border-radius:var(--r-sm)}
.pbtn>span:last-child{display:grid;min-width:0}
.pbtn small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.ver{display:grid}
.cell{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cell.ok svg{color:var(--good)}
.list>li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.list>li>div{display:grid;min-width:0}
.list>li.go{padding:0}
.list>li.go>button{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;border-radius:var(--r-lg)}
.list>li.go>button:hover{background:var(--wash)}
.list>li.go>button>span.grow{display:grid}
.path{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px}
.empty{padding:36px 20px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--muted)}
.empty strong{color:var(--text);font-size:15px}
.empty .btn{margin-top:8px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:38px;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:4px;display:grid;z-index:20}
.menu button{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:4px;white-space:nowrap}
.menu button:hover:not(:disabled){background:var(--wash-hover)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.menu .lbl{padding:6px 10px;color:var(--muted);font-size:12px}

/* project */
.crumb{margin-bottom:10px}
.projhead{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.projhead .sym{width:40px;height:40px;line-height:40px;font-size:14px}
.projfile{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted)}
.files{margin:0 0 16px;padding:12px 14px}
.files li{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:16px;padding:5px 0;align-items:baseline}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.steps4 button{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.steps4 button:hover{background:var(--raised)}
.steps4 button[aria-current="step"]{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.steps4 .num{width:24px;height:24px;border-radius:50%;background:var(--raised);font-weight:700;font-size:12px;line-height:24px;text-align:center;flex:none}
.steps4 button[aria-current="step"] .num{background:var(--primary);color:var(--on-primary)}
.steps4 span.t{display:grid;min-width:0}
.steps4 small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dec>li{align-items:flex-start}
.dec .tag{margin-top:1px;min-width:78px;justify-content:center}
.dec .to{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.two{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.sim{display:grid;gap:12px}
.simres{padding:12px 14px;display:grid;gap:8px}
.simres ol li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.simres ol b{width:20px;height:20px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:11px;line-height:20px;text-align:center}
.exlist{max-height:420px;overflow:auto}
.exlist button{display:grid;gap:1px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line)}
.exlist li:last-child button{border-bottom:0}
.exlist button:hover{background:var(--wash)}
.exlist button[aria-pressed="true"]{background:var(--raised);box-shadow:inset 2px 0 0 var(--accent)}
.graphcard{padding:12px 14px;overflow:auto;max-height:calc(100vh - 300px);min-height:320px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:22px;border-top:2px solid var(--line-strong);vertical-align:middle;margin-right:6px}
.legend i.need{border-top-style:dashed;border-color:var(--warn)}
.legend i.conf{border-top-style:dotted;border-color:var(--bad)}
.legend i.on{border-color:var(--accent)}
svg.graph{display:block}
.graph .e{fill:none;stroke:var(--line-strong);stroke-width:1.2;opacity:.55}
.graph .e.need{stroke:var(--warn);stroke-dasharray:5 4;opacity:.9}
.graph .e.conf{stroke:var(--bad);stroke-dasharray:1.5 4;stroke-linecap:round;opacity:.9}
.graph .n rect{fill:var(--raised);stroke:var(--line);stroke-width:1}
.graph .n text{fill:var(--text);font:12px "Segoe UI",sans-serif}
.graph .n.ent text{font-weight:600}
.graph .n.cap{cursor:pointer}
.graph .n.cap:hover rect{stroke:var(--line-strong)}
.graph.sim .e:not(.on),.graph.sim .n:not(.on){opacity:.22}
.graph .e.on{stroke:var(--accent);stroke-width:2;opacity:1}
.graph .n.on rect{stroke:var(--accent);stroke-width:1.6;fill:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.graph .n circle{fill:var(--primary)}
.graph .n text.num{fill:var(--on-primary);font-weight:700;font-size:11px}
.bar{height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .3s ease}

/* settings, activity */
.set{margin-bottom:16px}
.set>h2{padding:14px 16px 4px}
.set>p{padding:0 16px 6px;color:var(--muted)}
.row{display:flex;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--line)}
.set>h2+.row,.set>p+.row{border-top:0}
.row>div:first-child{display:grid;gap:1px;flex:1;min-width:0}
.row input:not([type=checkbox],[type=radio]){width:260px}
.act li{align-items:flex-start}
.act time{width:112px;flex:none;color:var(--muted);font-size:12px;padding-top:2px}
.job{padding:14px 16px;display:grid;gap:8px;margin-bottom:16px}
.job .top{display:flex;align-items:center;gap:10px}

/* setup */
.setupwrap{overflow:auto;display:grid;place-items:start center;padding:36px 20px}
.setupcard{width:min(560px,100%);display:grid;gap:16px}
.steps{display:flex;gap:6px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--primary)}
.pick label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.pick label>span:last-child{display:grid;min-width:0}
.setupfoot{display:flex;justify-content:space-between;gap:8px}
.err{color:var(--bad)}
.err:empty{display:none}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);color:var(--text);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:var(--scrim)}
dialog.sheet{position:fixed;top:44px;bottom:44px;right:0;left:auto;margin:0;height:auto;max-height:none;width:min(460px,100vw);border-radius:var(--r-lg) 0 0 var(--r-lg);border-right:0}
.dl{display:flex;flex-direction:column;gap:14px;padding:20px;max-height:inherit}
dialog.sheet .dl{height:100%;overflow:auto}
.dl footer{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;align-items:center}
dialog.sheet .dl footer{margin-top:auto;padding-top:14px;position:sticky;bottom:-20px;background:var(--panel);padding-bottom:20px;margin-bottom:-20px}
.dl footer .left{margin-right:auto}
.dlhead{display:flex;align-items:flex-start;gap:10px}
.dlhead div{display:grid;gap:2px;flex:1}
.fld{display:grid;gap:5px}
.fld>span,legend{font-weight:600;font-size:13px}
.fld em{font-style:normal;font-weight:400;color:var(--muted);margin-left:4px}
legend{margin-bottom:6px;padding:0}
.chk{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
details summary{cursor:pointer;color:var(--accent);font-weight:600;border-radius:4px}
details[open] summary{margin-bottom:10px}
.ops h3{display:flex;align-items:center;gap:8px;margin:6px 0}
.ops li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ops li div{display:grid;flex:1;min-width:0}
.ops .st{width:16px;display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.kv dt{color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

#toasts{position:absolute;right:16px;bottom:16px;display:grid;gap:8px;z-index:15;justify-items:end;pointer-events:none}
.toast{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 14px;max-width:420px;display:flex;gap:8px;align-items:center;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

@media (max-width:980px){.two{grid-template-columns:1fr}.steps4{grid-template-columns:repeat(2,1fr)}.files li{grid-template-columns:1fr}}
@media (max-width:760px){
  .tstatus span{display:none}
  .titlebar{gap:8px}
  nav button{padding:0 8px}
  .main{padding:18px 16px}
  .row{flex-wrap:wrap}
  .path{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

,"caps":["text-humanize"],"absorbs":["text-humanizer","humanize"]}],"examples":[{"title":"Landing con animazioni allo scroll","task":"Progetta una nuova landing page e definisci le animazioni allo scroll, poi implementale nel progetto che usa GSAP.","status":"selected","stack":["stack:gsap"],"sel":[{"c":"visual-direction","intent":"ui.landing-strategy","reason":"La nuova landing richiede offerta, struttura dei contenuti e direzione visiva coerenti."},{"c":"motion-principles","intent":"ui.motion-design","reason":"La richiesta lascia aperti comportamento e tempi: serve definire la specifica di movimento."},{"c":"gsap-scrolltrigger","intent":"ui.scroll-animation","reason":"Il progetto usa GSAP e viene richiesta l'implementazione delle animazioni allo scroll."}],"reason":"Prima la direzione della pagina, poi la specifica di movimento, infine il codice. È un percorso esemplare scelto dall'IA per questa richiesta, non un obbligo per ogni animazione.","questions":[]},{"title":"Landing nuova in Figma","task":"Disegna in Figma la landing page del nostro nuovo prodotto; non abbiamo ancora una struttura dei contenuti.","status":"selected","stack":[],"sel":[{"c":"visual-direction","intent":"ui.landing-strategy","reason":"Manca offerta e struttura della pagina: servono prima di disegnare le sezioni."},{"c":"figma-design","intent":"ui.figma-design","reason":"Il risultato richiesto è un design dentro il file Figma."}],"reason":"Il prerequisito condizionato di Figma Design vale in questo caso: prima la strategia della landing, poi il design. Per un componente o una schermata app l'IA avrebbe risposto che non si applica.","questions":[]},{"title":"Convertire un documento in PDF","task":"Converti il documento Word esistente in PDF senza cambiarne il contenuto.","status":"selected","stack":[],"sel":[{"c":"office-files","intent":"office.format-conversion","reason":"Serve un'operazione sul file esistente; non la scrittura di un nuovo documento né una direzione visiva."}],"reason":"Un so ile dell'onboarding della nostra nuova app: non abbiamo ancora né brand né design system. Prima di consegnarlo controlla accessibilità e stati dei bottoni.","status":"selected","stack":[],"sel":[{"c":"aesthetic-direction","intent":"ui.aesthetic-direction","reason":"Non esiste nulla a cui adeguarsi: prima si sceglie e si scrive una direzione visiva insieme all'utente."},{"c":"ui-prototype","intent":"ui.interactive-prototype","reason":"Il risultato richiesto è un flusso cliccabile con stato, validazione e feedback reali, costruito sulla direzione registrata."},{"c":"design-review","intent":"ui.polish-pass","reason":"L'utente chiede un controllo prima della consegna: accessibilità e stati rientrano nel passaggio completo, che corregge ciò che trova."}],"reason":"Tre passi in ordine: la direzione, il prototipo che la legge, la revisione che la rispetta come sistema dichiarato. Con un brand o un design system esistente l'IA avrebbe risposto che il prerequisito non si applica.","questions":[]},{"title":"Esplorare prima di disegnare","task":"Fammi tre o quattro wireframe diversi per la schermata di checkout su mobile, così scegliamo la struttura prima di disegnarla davvero.","status":"selected","stack":[],"sel":[{"c":"wireframe","intent":"ui.wireframe-exploration","reason":"Serve confrontare strutture a bassa fedeltà, in scala di grigi e annotate: nessuna direzione visiva e nessun prototipo sono ancora richiesti."}],"reason":"Un solo passo. La scelta dell'utente viene registrata e diventa il brief del prototipo, che è un'altra richiesta.","questions":[]},{"title":"Token dal codice a Figma","task":"Estrai i design token dal tema del nostro frontend e usali per impostare le variabili nel file Figma. L'integrazione Figma è collegata.","status":"selected","stack":[],"sel":[{"c":"design-system-extract","intent":"ui.token-extraction","reason":"I valori reali vanno letti dal codice e scritti in un file di token, segnalando lacune e incoerenze."},{"c":"figma-design","intent":"ui.f const pExamples=p=>{const ids=new Set(pCaps(p).map(c=>c.id));return M.examples.map((e,i)=>({...e,i})).filter(e=>!p.proj.scope||e.sel.some(x=>ids.has(x.c)));};
const pRecords=p=>[...p.proj.recAdded.map(r=>({...r,mine:true,key:r.id})),...M.records.map((r,i)=>({...r,key:'m'+i})).filter(r=>!p.proj.scope||p.proj.scope.some(id=>r.text.includes(id)))].map(r=>p.proj.recEdits[r.key]?{...r,text:p.proj.recEdits[r.key],edited:true}:r);
const release=s=>S.pins[s.id]||s.release;
const hasUpdate=s=>!!S.updates[s.id]&&S.updates[s.id]!==release(s);
const done=p=>p.proj.runs.some(r=>r.status==='completed');
const jobOf=p=>S.jobs.find(j=>j.status==='running'&&j.plugin===p.id);
function projState(p){const j=jobOf(p);
  if(j)return{k:'run',label:'Harmonizing…',tone:'accent',why:PHASES[j.phase]};
  if(!done(p))return{k:'new',label:'Not harmonized yet',tone:'warn',why:'The AI has not read the inputs yet: there is no version to install.'};
  if(p.proj.dirty.length)return{k:'dirty',label:'Needs harmonizing',tone:'warn',why:p.proj.dirty.join(' · ')};
  const u=pInputs(p).filter(hasUpdate);
  if(u.length)return{k:'upd',label:'Input update available',tone:'accent',why:u.map(s=>`${s.id} ${S.updates[s.id]}`).join(', ')+' found upstream. Move the pin in Inputs to take it.'};
  return{k:'ok',label:'Harmonized',tone:'good',why:`Version ${p.upstream} matches the inputs as they are pinned.`};}

function cell(p,t){
  if(!p.targets.includes(t.id))return t.installed[p.id]?{k:'remove',from:t.installed[p.id]}:{k:'none'};
  if(p.resolving)return{k:'resolving'};
  const b=p.builds[t.harness];if(!b)return{k:'adapt'};
  const i=t.installed[p.id];if(!i)return{k:'install',to:b.v};
  if(i!==b.v)return{k:'update',from:i,to:b.v};
  return S.reinstall[p.id]?{k:'reinstall',from:i,to:b.v}:{k:'ok',v:i};
}
function plan(){const ops=[],blockers=[];
  for(const t of managed()){
    for(const p of S.plugins){const c=cell(p,t);
      if(['install','update','remove','reinstall'].includes(c.k))ops.push({kind:c.k,p,t,name:p.name,from:c.from,to:c.to});
      if(c.k==='adapt')blockers.push({p,t});}
    if(t.exclusive)for(const u of t.unlisted)ops.push({kind:'remove',u,t,name:u.name,from:u.version,why:'Not in your list'});}
  return{ops,blockers};}
function applyOp(o){const t=o.t;t.synced=t.checked=S.lastSync=now();
  if(o.u)t.unlisted=t.unlisted.filter(u=>u!==o.u);
  else if(o.kind==='remove')delete t.installed[o.p.id];
  else{t.installed[o.p.id]=o.to;if(o.kind==='reinstall')delete S.reinstall[o.p.id];}}
const needsAction=p=>managed().some(t=>!['ok','none'].includes(cell(p,t).k));

function stepHarmonize(p){const st=projState(p),j=jobOf(p),has=done(p),last=p.proj.runs[0],view=S.ui.hview,recs=has?pRecords(p):[];

function simPlan(sim){return sim&&sim.i!=null?M.examples[sim.i].sel:[];}
function graph(p){const ents=pEntries(p),sim=S.ui.sim,sel=simPlan(sim),on=new Map(sel.map((x,i)=>[x.c,i+1]));
  const RH=28,GAP=12,EX=4,EW=230,CX=330,CW=300,pos={},epos=[],mid=v=>v+11;let y=6;
  for(const e of ents){const y0=y;let n=0;for(const c of e.caps)if(pos[c]==null){pos[c]=y;y+=RH;n++;}if(n)epos.push({e,y:(y0+y-RH)/2});y+=GAP;}
  const H=y,W=CX+CW+100;
  const arc=(a,b,cls,title)=>{const x=CX+CW,dx=24+Math.min(Math.abs(a-b)/5,64);return`<path class="e ${cls}" d="M${x} ${mid(a)} C${x+dx} ${mid(a)} ${x+dx} ${mid(b)} ${x} ${mid(b)}"><title>${esc(title)}</title></path>`;};
  let edges='',nodes='';
  for(const{e,y:ey}of epos){for(const c of e.caps)edges+=`<path class="e ${on.has(c)?'on':''}" d="M${EX+EW} ${mid(ey)} C${EX+EW+40} ${mid(ey)} ${CX-40} ${mid(pos[c])} ${CX} ${mid(pos[c])}"/>`;
    nodes+=`<g class="n ent ${e.caps.some(c=>on.has(c))?'on':''}" transform="translate(${EX} ${ey})"><title>${esc(e.d)}</title><rect width="${EW}" height="22" rx="6"/><text x="10" y="15">${esc(e.name.replace(M.plugin.slug+'-',''))}</text></g>`;}
  for(const c of pCaps(p)){if(pos[c.id]==null)continue;
    for(const n of c.needs)if(pos[n.c]!=null)edges+=arc(pos[c.id],pos[n.c],'need'+(on.has(c.id)&&on.has(n.c)?' on':''),`${c.id} needs ${n.c} when: ${n.label}`);
    for(const x of c.conflicts)if(pos[x]!=null&&c.id<x)edges+=arc(pos[c.id],pos[x],'conf',`${c.id} never runs with ${x}`);
    nodes+=`<g class="n cap ${on.has(c.id)?'on':''}" transform="translate(${CX} ${pos[c.id]})" tabindex="0" role="button" data-act="cap" data-id="${c.id}" data-k="capnode:${c.id}" aria-label="Capability ${esc(c.id)}"><title>${esc(c.title)}</title><rect width="${CW}" height="22" rx="6"/><text x="10" y="15">${esc(c.id)}</text>${on.has(c.id)?`<circle cx="${CW-13}" cy="11" r="8"/><text class="num" x="${CW-13}" y="15" text-anchor="middle">${on.get(c.id)}</text>`:''}</g>`;}
  return`<svg class="graph ${sel.length?'sim':''}" viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px" role="group" aria-label="Decision graph: entries on the left, capabilities on the right">${edges}${nodes}</svg>`;}
function stepGraph(p){if(!done(p))return empty('No graph yet','The decision graph is written by the first harmonization.',btn('Go to Harmonize','step',{id:'harmonize',h:'empty'}));

  const res=!sim?'':ex?`<div class="card simres" role="status"><div><span class="tag ${ex.status==='selected'?'good':'warn'}">${ex.status==='selected'?plural(ex.sel.length,'step'):'No match'}</span> <small>${ex.stack.length?'With '+esc(ex.stack.join(', ')):''}</small></div><p>“${esc(ex.task)}”</p>

      <small>${esc(ex.reason)}</small>${btn('Clear','sim-clear',{cls:'sm'})}</div>`

  return`<div class="two"><div class="sim"><div><h2>Simulate a request</h2><small>See which branch of the graph a request activates, and in what order.</small></div>

    ${res}
    <h3>Documented examples <span class="count">${exs.length}</span></h3>
    <ul class="card exlist">${exs.map(e=>`<li><button type="button" data-act="sim-example" data-id="${e.i}" data-k="sim-example:${e.i}" aria-pressed="${sim?.i===e.i}"><strong>${esc(e.title)}</strong><small>${esc(e.task)}</small></button></li>`).join('')}</ul></div>
  <div class="card graphcard"><div class="legend"><span><i></i>entry → capability</span><span><i class="need"></i>needs, on a condition</span><span><i class="conf"></i>never together</span>${ex&&ex.sel.length?'<span><i class="on"></i>activated, in order</span>':''}<span class="grow"></span><span>${plural(pEntries(p).length,'entry','entries')} · ${plural(pCaps(p).length,'capability','capabilities')}</span></div>${graph(p)}</div></div>`;}

function cellHtml(p,t){const c=cell(p,t);switch(c.k){

/* ---------- first run ---------- */
function setupCandidates(){const full=seed();return[...full.targets.map(t=>({harness:t.harness,name:t.name,root:t.root,supported:true})),...full.found];}
function setupImportables(){const full=seed(),s=S.setup,out=[];
  for(const p of full.plugins){const on=full.targets.filter(t=>s.pick[t.harness]&&t.installed[p.id]);if(on.length||p.proj?.builtin)out.push({key:'p:'+p.id,name:p.name,fixed:!!p.proj?.builtin,where:(p.proj?.builtin?'Included with Muro'+(on.length?' · ':''):'')+on.map(t=>`${t.name} ${t.installed[p.id]}`).join(', ')});}
  for(const t of full.targets)if(s.pick[t.harness])t.unlisted.forEach((u,i)=>out.push({key:`u:${t.id}:${i}`,name:u.name,where:`${t.name} ${u.version}`}));
  return out;}
function pageSetup(){const s=S.setup,steps=`<div class="steps" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=s.step?'on':''}"></i>`).join('')}</div><small>Step ${s.step} of 3</small>`;
  let body;
  if(s.step===1)body=`<h1>Which coding agents does Muro manage?</h1><p class="muted">Found on this computer. You can add or remove harnesses later.</p>
    <ul class="card list pick">${setupCandidates().map(c=>`<li><label><input type="checkbox" data-pick="${c.harness}" data-k="pick:${c.harness}" ${s.pick[c.harness]?'checked':''} ${c.supported?'':'disabled'}>${mark(c.harness)}<span><strong>${esc(c.name)}</strong><small>${c.supported?`<code>${esc(c.root)}</code>`:'Plugins are not supported yet'}</small></span></label></li>`).join('')}</ul>
    <p class="err" role="alert">${s.err||''}</p><div class="setupfoot"><span></span>${btn('Continue','setup-next',{cls:'primary'})}</div>`;
  else if(s.step===2){const items=setupImportables();body=`<h1>Start from what is installed</h1><p class="muted">These plugins are already on the harnesses you picked. The ones you keep become your list.</p>
    ${items.length?`<ul class="card list pick">${items.map(it=>`<li><label><input type="checkbox" data-imp="${it.key}" data-k="imp:${it.key}" ${it.fixed||s.imp[it.key]!==false?'checked':''} ${it.fixed?'disabled':''}><span><strong>${esc(it.name)}</strong><small>${esc(it.where)}</small></span></label></li>`).join('')}</ul>`:empty('Nothing installed yet','Your list starts empty. Add plugins or make a project afterwards.')}
    <div class="setupfoot">${btn('Back','setup-back')}${btn('Continue','setup-next',{cls:'primary'})}</div>`;}
  else body=`<h1>Keep them in sync by itself?</h1><p class="muted">Muro can stay in the notification area and apply changes without you opening it.</p>
    <div class="card set" style="margin:0">${row('Automatic sync','Checks every hour and applies what changed.',sw(s.auto,'setup-auto','Automatic sync'))}${row('Start Muro when Windows starts','Starts in the notification area, without opening a window.',sw(s.autostart,'setup-autostart','Start Muro when Windows starts'))}</div>
    <div class="setupfoot">${btn('Back','setup-back')}${btn('Finish','setup-finish',{cls:'primary'})}</div>`;
  return`<div class="main setupwrap"><div class="setupcard">${steps}${body}</div></div>`;}
function finishSetup(){const full=seed(),s=S.setup,targets=full.targets.filter(t=>s.pick[t.harness]);
  const oc=full.found.find(f=>f.harness==='opencode');
  if(s.pick.opencode)targets.push(newTarget(oc));
  const keep=p=>!!p.proj?.builtin||s.imp['p:'+p.id]!==false;
  const plugins=full.plugins.filter(p=>keep(p)&&(p.proj?.builtin||targets.some(t=>t.installed[p.id]))).map(p=>({...p,targets:p.targets.filter(id=>targets.some(t=>t.id===id&&t.installed[p.id]))}));
  for(const p of full.plugins.filter(p=>!keep(p)))for(const t of targets)if(t.installed[p.id]){t.unlisted.push({name:p.name,version:t.installed[p.id],path:t.root+'\\plugins\\'+p.id});delete t.installed[p.id];}
  Object.assign(S,{targets,plugins,found:full.found.filter(f=>!targets.some(t=>t.harness===f.harness)),setup:null,page:'sync',lastCheck:now()});
  for(const t of targets)[...t.unlisted].forEach((u,i)=>{if(s.imp[`u:${t.id}:${i}`]!==false&&full.targets.find(x=>x.id===t.id)?.unlisted[i]?.name===u.name)importUnlisted(t,u);});
  S.settings.auto=s.auto;S.settings.autostart=s.autostart;
  log('list','Muro set up',`${plural(targets.length,'harness','harnesses')} managed, ${plural(S.plugins.length,'plugin')} in your list.`);
  toast('Muro is set up.','good');}
function newTarget(f){return{id:'t-'+f.harness+(targ('t-'+f.harness)?'-'+Date.now():''),harness:f.harness,name:f.name,root:f.root,exe:f.exe,enabled:true,exclusive:false,checked:now(),synced:null,installed:{},unlisted:[]};}
function importUnlisted(t,u){const id=u.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  S.plugins.push({id,name:u.name,kind:'native',source:u.path,policy:'stable',pinned:'',upstream:u.version,lastChecked:now(),targets:[t.id],builds:{[t.harness]:{v:u.version,origin:'native'}}});
  t.installed[id]=u.version;t.unlisted=t.unlisted.filter(x=>x!==u);}

function render(){applyTheme();
  const app=$('#app'),k=document.activeElement?.dataset?.k,inApp=app.contains(document.activeElement),top=$('.main')?.scrollTop||0,gtop=$('.graphcard')?.scrollTop||0;

  if(!Object.keys(p.builds).length||isNew){const v=p.policy==='pinned'?p.pinned:(p.upstream||'1.0.0');p.upstream=v;p.builds={'claude-code':{v,origin:'native'}};toast(`${p.name} ${v} found, native for Claude Code.`,'good');}
  else toast(`${p.name}: no new version.`);render();},1300);}
function check(){if(S.busy||RUN)return;S.busy='check';render();setTimeout(()=>{S.busy=null;S.lastCheck=now();S.plugins.forEach(p=>p.lastChecked=S.lastCheck);managed().forEach(t=>t.checked=S.lastCheck);
  /* demo: the first check finds a new release of one input, so the whole loop can be tried */
  const src=srcOf('ponytail'),found=!S.updates.ponytail&&!S.pins.ponytail&&src;if(found)S.updates.ponytail=src.release.replace(/(\d+)$/,n=>+n+1);
  const n=plan().ops.length,msg=[n?`${plural(n,'change')} ready to apply.`:'',found?`New release of the input ponytail: ${S.updates.ponytail}.`:''].filter(Boolean).join(' ')||'Nothing new.';
  log('check','Checked sources and harnesses',msg);toast('Checked. '+msg,'good');render();},1500);}
function apply(all){const d=all?null:S.ui.dialog?.arg,one=targ(d?.id),pp=plug(d?.pid),ops=plan().ops.filter(o=>(!one||o.t===one)&&(!pp||o.p===pp));if(!ops.length||RUN)return;RUN={queue:ops,i:0};if(dlg.open)renderDialog();
  const step=()=>{applyOp(RUN.queue[RUN.i]);RUN.i++;
    if(RUN.i<RUN.queue.length){if(dlg.open)renderDialog();render();setTimeout(step,750);return;}
    const n=RUN.queue.length,names=[...new Set(RUN.queue.map(o=>o.name))].join(', ');RUN=null;S.lastCheck=now();
    log('sync',`Applied ${plural(n,'change')}`,names+'.');toast(`Done. ${plural(n,'change')} applied.`,'good');if(dlg.open)closeDialog();else render();};
  setTimeout(step,750);}
const acts={
  nav:d=>{if(d.id==='projects'&&S.page==='projects')S.ui.proj=null;S.page=d.id;},
  'open-project':d=>{S.page='projects';Object.assign(S.ui,{proj:d.id,step:d.h||'inputs',sim:null,dsrc:'',dform:'all'});if(dlg.open)closeDialog();},
  'close-project':()=>{S.ui.proj=null;},
  'open-plugin':d=>{const p=plug(d.id);if(p.kind==='project')acts['open-project']({id:p.id,h:'install'});else openDialog('plugin',{id:p.id});},
  step:d=>{S.ui.step=d.id;},
  'decisions-of':d=>{S.ui.step='harmonize';S.ui.hview='choices';S.ui.dsrc=d.id;S.ui.dform='all';},
  'add-record':()=>openDialog('record'),
  'edit-record':d=>openDialog('record',{id:d.id}),
  'move-pin':d=>{const p=plug(S.ui.proj),to=S.updates[d.id];S.pins[d.id]=to;p.proj.dirty.push(`${d.id} moved to ${to}`);toast(`${d.id} pinned to ${to}. The project needs harmonizing.`,'good');},
  'add-input':()=>openDialog('input'),
  harmonize:d=>openDialog('harmonize',{id:d.id}),
  'new-project':()=>openDialog('newproject'),
  'make-project':d=>openDialog('newproject',{id:d.id}),
  'open-file':d=>toast(`Opens ${d.id} (simulated in this prototype).`),
  cap:d=>openDialog('cap',{id:d.id}),
  'sim-example':d=>{S.ui.sim=S.ui.sim?.i===+d.id?null:{i:+d.id};},
  'sim-clear':()=>{S.ui.sim=null;},
  'clear-filter':()=>{S.ui.q='';S.ui.filter='all';},
  check,
  review:d=>openDialog('review',d.id?{id:d.id}:d.h&&plug(d.h)?{pid:d.h}:{}),
  apply:()=>apply(false),
  'apply-all':()=>apply(true),
  'add-plugin':()=>openDialog('plugin'),
  'ask-remove-plugin':d=>{const p=plug(d.id);openDialog('confirm',{id:p.id,run:'remove-plugin',title:`Remove ${p.name} from your list?`,msg:'It stays installed where it is, unless plugins outside your list are always uninstalled.',ok:'Remove',danger:true});},
  import:d=>{const t=targ(d.id),u=t.unlisted[+d.h];importUnlisted(t,u);toast(`${u.name} added to your list.`,'good');if(S.ui.dialog)renderDialog();},
  toggle:d=>{const s=S.settings;
    if(d.what==='assign'){const[pid,tid]=d.id.split('|'),p=plug(pid);p.targets=p.targets.includes(tid)?p.targets.filter(x=>x!==tid):[...p.targets,tid];}
    else if(d.what.startsWith('setup-')){const k=d.what.slice(6);S.setup[k]=!S.setup[k];}
    else{s[d.what]=!s[d.what];toast('Saved.','good');}},
  rescan:()=>{toast('Looking for harnesses on this computer…');setTimeout(()=>{toast(`Rescan done. ${plural(S.targets.length+S.found.length,'harness','harnesses')} on this computer.`,'good');render();},1400);},
  'add-harness':()=>openDialog('harness'),
  'manage-found':d=>openDialog('harness',{found:d.id}),
  'edit-harness':d=>openDialog('harness',{id:d.id}),
  'ask-remove-harness':d=>{const t=targ(d.id);openDialog('confirm',{id:t.id,run:'remove-harness',title:`Stop managing ${t.name}?`,msg:'Its plugins stay installed. Muro only stops syncing it.',ok:'Stop managing',danger:true});},
  'cancel-job':d=>{const j=S.jobs.find(x=>x.id===d.id),p=plug(j.plugin);j.status='cancelled';p?.proj.runs.unshift({id:j.id,t:now(),status:'cancelled',version:'',budget:j.budget,note:'Cancelled: nothing was recorded.'});log('ai',`Harmonization of ${p?.name||j.plugin} cancelled`,'Nothing was recorded.','cancelled');toast('Harmonization cancelled.');},
  verify:()=>{S.busy='verify';S.maint=null;render();setTimeout(()=>{S.busy=null;const n=S.plugins.reduce((a,p)=>a+Object.keys(p.builds).length,0);S.maint=`Verified: ${plural(n,'stored build')} match what Muro recorded.`;render();},1400);},
  'ask-cleanup':()=>openDialog('confirm',{run:'cleanup',title:'Clean up unused builds?',msg:'Only stored builds that nothing uses are deleted.',ok:'Clean up',danger:true}),
  'dlg-cancel':()=>closeDialog(),
  menu:(d,b)=>{const m=b.nextElementSibling,open=m.hidden;closeMenus();m.hidden=!open;b.setAttribute('aria-expanded',open);if(open)m.querySelector('button').focus();return false;},
  'win-close':()=>{if(S.settings.tray){S.win='hidden';if(!S.ui.hinted){S.ui.hinted=true;osnote('Muro is still running','It keeps your harnesses in sync from the notification area.');}}else S.win='quit';},
  tray:()=>{const m=$('#traymenu'),{ops}=plan(),open=m.hidden;closeMenus();
    m.innerHTML=`<div class="lbl">${ops.length?plural(ops.length,'change')+' waiting':'In sync'} · checked ${when(S.lastCheck)}</div><hr><button type="button" role="menuitem" data-act="tray-open">Open Muro</button><button type="button" role="menuitem" data-act="tray-sync">Sync now</button><button type="button" role="menuitem" data-act="tray-pause">${S.settings.auto?'Pause automatic sync':'Resume automatic sync'}</button><hr><button type="button" role="menuitem" data-act="tray-quit">Quit Muro</button>`;
    m.hidden=!open;if(open)m.querySelector('button').focus();return false;},
  'tray-open':()=>{S.win='open';},
  'tray-sync':()=>{osnote('Muro','Syncing…');setTimeout(()=>{const{ops}=plan();ops.forEach(applyOp);S.lastCheck=now();if(ops.length)log('sync',`Applied ${plural(ops.length,'change')}`,[...new Set(ops.map(o=>o.name))].join(', ')+'.');osnote('Muro',ops.length?`${plural(ops.length,'change')} applied.`:'Everything is already in sync.');render();},1400);},
  'tray-pause':()=>{S.settings.auto=!S.settings.auto;osnote('Muro',S.settings.auto?'Automatic sync is on again.':'Automatic sync paused.');},
  'tray-quit':()=>{S.win='quit';},
  start:()=>{S.win='open';},
  'proto-first':()=>{S=firstRun();},
  'proto-reset':()=>{S=seed();toast('Demo data reset.');},
  'setup-next':()=>{const s=S.setup;if(s.step===1&&!Object.values(s.pick).some(Boolean)){s.err='Pick at least one harness.';return;}s.err='';s.step++;},
  'setup-back':()=>{S.setup.step--;},
  'setup-finish':finishSetup
};
function closeMenus(){document.querySelectorAll('.menu').forEach(m=>m.hidden=true);document.querySelectorAll('[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');
  if(!b){closeMenus();return;}if(b.disabled)return;
  const fn=acts[b.dataset.act];if(!fn)return;
  if(fn(b.dataset,b)===false)return;
  closeMenus();if(S.ui.dialog&&!dlg.open){renderDialog();dlg.showModal();}render();});
document.addEventListener('change',e=>{const el=e.target;if(dlg.contains(el))return;
  if(el.name==='filter'){S.ui.filter=el.value;}
  else if(el.name==='afilter'){S.ui.afilter=el.value;}
  else if(el.name==='dform'){S.ui.dform=el.value;}
  else if(el.name==='hview'){S.ui.hview=el.value;}
  else if(el.dataset.ui){S.ui[el.dataset.ui]=el.value;}
  else if(el.name==='excl'){S.targets.forEach(t=>t.exclusive=el.value==='remove');toast(el.value==='remove'?'Saved. Plugins outside your list are uninstalled at the next sync.':'Saved. Plugins outside your list are left alone.','good');}
  else if(el.name==='theme'){S.settings.theme=el.value;toast('Saved.','good');}
  else if(el.dataset.set){S.settings[el.dataset.set]=el.dataset.set==='interval'?+el.value:el.value.trim();toast('Saved.','good');}
  else if(el.dataset.pick){S.setup.pick[el.dataset.pick]=el.checked;S.setup.err='';}
  else if(el.dataset.imp){S.setup.imp[el.dataset.imp]=el.checked;}
  else return;render();});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.ui.q=e.target.value;$('#rows').innerHTML=rows();save();}
  if(e.target.name==='text'&&e.target.closest('[data-form="sim"]')){S.ui.simText=e.target.value;$('#err-text').textContent='';save();}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='sim')return;e.preventDefault();const t=f.elements.text.value.trim();
  if(!t){$('#err-text',f).textContent='Write a request first.';f.elements.text.focus();return;}S.ui.sim={text:t};render();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const open=[...document.querySelectorAll('.menu')].find(m=>!m.hidden);if(open){const t=open.id==='traymenu'?$('.trayico'):open.previousElementSibling;closeMenus();t?.focus();}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('g[role="button"]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
  if(e.key==='/'&&!dlg.open&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){const q=$('#q');if(q){e.preventDefault();q.focus();}}});
matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme);

/* Harmonization runs advance on one timer, so a reload resumes them. */
const bump=v=>/\d+$/.test(v)?v.replace(/(\d+)$/,n=>+n+1):'0.1.0';
setInterval(()=>{let changed=false;for(const j of S.jobs){if(j.status!=='running')continue;changed=true;j.phase++;
  if(j.phase>=PHASES.length){j.phase=PHASES.length-1;j.status='done';const p=plug(j.plugin);if(!p)continue;
    const v=done(p)?bump(p.upstream):(p.upstream||'0.1.0');p.upstream=v;p.builds=Object.fromEntries(MUROH.map(h=>[h,{v,origin:'muro'}]));for(const r of pRecords(p))if((r.mine||r.edited)&&!p.proj.recSince[r.key])p.proj.recSince[r.key]=v;p.proj.dirty=[];p.proj.runs.unshift({id:j.id,t:now(),status:'completed',version:v,budget:j.budget,note:j.note,auto:true});
    log('ai',`${p.name} harmonized: version ${v}`,'The build passed validation and is ready to install.');toast(`${p.name} ${v} is built. Open Sync to install it.`,'good');}}
  if(changed){render();if(S.ui.dialog?.kind==='review'&&!RUN)renderDialog();}},2600);

render();
if(S.ui.dialog){renderDialog();dlg.showModal();}
</script>
