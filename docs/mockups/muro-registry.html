<style>

0px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#0b0d17;font-size:12px;color:var(--muted)}.topbar .title{letter-spacing:1.2px;color:var(--ice);font-size:11px}.window-controls{display:flex;gap:23px;opacity:.65;user-select:none}.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:calc(100vh - 70px)}.sidebar{background:#0e101b;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px 14px;gap:25px}.brand{width:190px;height:66px;object-fit:contain;display:block;margin:0 auto}.workspace{padding:11px;border:1px solid var(--line);background:var(--panel);border-left:2px solid var(--violet);display:flex;gap:10px;align-items:center}.workspace strong{display:block;font-size:12px}.workspace small{font-size:11px}.nav-group .eyebrow{margin:0 12px 10px}nav{display:grid;gap:4px}nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;text-align:left;color:var(--muted);width:100%;border:1px solid transparent}nav button.active{color:var(--accent);background:#211b33;border-color:#3a2e55}nav button span.count{margin-left:auto;font-size:11px;border-radius:3px;padding:0 6px;background:#36294d}.sidebar-bottom{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line)}.dot{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}.body{min-width:0;padding:30px 32px 26px}.header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.header p{margin-top:6px;color:var(--muted);font-size:13px}.breadcrumb{margin-bottom:15px;font-size:12px;color:var(--muted)}.breadcrumb span{padding:0 8px;color:#626e8c}.overview{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:26px;border:1px solid var(--line);background:var(--panel)}.metric{padding:17px 20px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric .value{font-size:25px;font-weight:500;line-heigh 11px;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line)}.detail{border:1px solid #44375c;background:#131321;align-self:start}.detail-head{padding:19px;border-bottom:1px solid var(--line);background:#1c182a}.detail-head .plugin-symbol{height:41px;width:41px}.detail-body{padding:19px}.detail h3{margin-bottom:9px}.detail p{font-size:12px;line-height:1.7;color:var(--muted)}.detail dl{margin:20px 0;display:grid;grid-template-columns:1fr auto;row-gap:11px;font-size:12px}.detail dt{color:var(--muted)}.detail dd{margin:0}.deployment{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:10px 0;border-bottom:1px solid #27273a}.deployment:last-child{border:0}.detail .btn{width:100%;margin-top:16px;font-size:12px}.notice{margin-top:18px;padding:14px 16px;border:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#121622;font-size:12px}.notice p{color:var(--muted);margin-top:3px}.notice button{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--ice)}.bottom{height:30px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:0 18px;background:#0b0e18;font-size:10px;color:var(--muted)}.footer-tag{color:var(--accent);letter-spacing:.5px}.empty{padding:40px;text-align:center;color:var(--muted)}.panel{border:1px solid var(--line);background:var(--panel);padding:22px;margin-bottom:18px}.panel p{color:var(--muted);font-size:13px;margin:7px 0 15px}.harness-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.harness-card{border:1px solid var(--line);background:var(--panel);padding:21px}.harness-card h2{font-size:16px}.harness-card .mono{margin:18px 0;color:var(--muted);overflow-wrap:anywhere}.harness-card .btn{font-size:12px;margin-top:17px;width:100%}.switch{appearance:none;width:32px;height:18px;border-radius:12px;border:1px solid #66718b;background:#3b4255;position:relative;cursor:pointer;flex-shrink:0}.switch:before{content:'';position:absolute;left:3px;top:3px;width:10px;height:10px;border-radius:50%;background:#eef1ff}.switch:checked{background:#7351a9;border-color:#b495e7}.switch:checked:before{left:17px}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}.setting p{margin:3px 0 0;font-size:12px}.timeline{padding-left:18px;border-left:1px solid #4e3f68}.timeline article{margin:0 0 28px;position:relative}.timeline article:before{content:'';position:absolute;left:-23px;top:6px;width:9px;height:9px;background:var(--accent);border:2px solid var(--bg);border-radius:50%}.timeline small{display:block;margin-top:5px}dialog{max-width:520px;width:calc(100% - 32px);padding:26px;color:var(--text);background:#151725;border:1px solid #5b4979;border-radius:8px;box-shadow:0 30px 100px #0009}dialog::backdrop{background:#04060cbb;backdrop-filter:blur(4px)}dialog h2{margin-bottom:10px}dialog p{color:var(--muted);font-size:13px;margin-bottom:18px}dialog label{display:block;margin-bottom:15px;font-size:12px}dialog input:not([type=checkbox]),dialog select{display:block;margin-top:6px;width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid #65708a}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:#29233a;border:1px solid #776391;padding:12px 20px;z-index:5;max-width:90%;font-size:13px;box-shadow:0 10px 40px #0008}.toast:empty{display:none}.skip{position:absolute;top:-100px}.skip:focus{top:8px;left:10px;z-index:10;background:var(--panel);color:var(--text);padding:10px}.section-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.error{color:var(--bad);font-size:12px;margin:10px 0}.sync-summary{display:flex;gap:20px;margin:15px 0;font-size:13px}.sync-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(min-width:1550px){.body{padding: </style></head><body>
<a class="skip" href="#main">Vai al contenuto</a><div class="topbar"><span>MURO <span style="color:#68738d;margin:0 10px">/</span> Control room</span><span class="title">UN REGISTRY. TUTTE LE TUE HARNESS.</span><span class="window-controls" aria-hidden="true">— □ ×</span></div>
<div class="shell"><aside class="sidebar"><img class="brand" src="../assets/branding/muro-logo.png" alt="Muro"><div class="workspace"><span class="accent" id="workspace-icon"></span><div><strong>Registry personale</strong><small>Locale · Questo dispositivo</small></div></div><div class="nav-group"><p class="eyebrow">Workspace</p><nav id="nav"></nav></div><div class="sidebar-bottom"><div class="flex"><span class="dot"></span><strong style="font-size:12px">Mukade</strong></div><p style="font-size:11px;color:var(--muted);margin-top:7px">Discovery delle harness<br><span class="accent">6 istanze nel mockup</span></p></div></aside><main id="main" class="body" tabindex="-1"></main></div>
<footer class="bottom"><span class="footer-tag">PROTOTIPO INTERATTIVO · DATI DIMOSTRATIVI</span><span class="optional">Nessuna modifica alle installazioni reali</span><span>Muro / Registry & sync</span></footer><dialog id="modal"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const paths={box:'M12 3 3 8v9l9 5 9-5V8z M3 8l9 5 9-5 M12 13v9 M7.5 5.5l9 5',grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',terminal:'M3 5h18v14H3z M7 9l3 3-3 3 M13 15h4',sync:'M20 8a8 8 0 0 0-14-3L3 8 M3 3v5h5 M4 16a8 8 0 0 0 14 3l3-3 M16 16h5v5',clock:'M12 8v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',tool:'M14 4a6 6 0 0 0-7 7L3 17a3 3 0 0 0 4 4l6-6a6 6 0 0 0 7-7l-4 4-4-4z',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M15 15l6 6',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 M14 7l5 5-5 5',check:'M5 12l4 4L19 6',shield:'M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z M8 12l3 3 5-6',branch:'M6 3v14a3 3 0 1 0 3 3 M6 10h8a4 4 0 0 0 4-4V3',close:'M6 6l12 12 M6 18 18 6'};
const icon=(n)=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.box}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='registry',tab='all',query='',selected=0,synced=false,exclusive=true,auto=true;
const plugins=[{name:'Marionette',symbol:'M',source:'Muro package',version:'0.2.0',latest:'0.3.0',targets:['C','X','O','P','H'],state:'update',desc:'Design, engineering e ricerca. Un coordinatore, tutte le capability del tuo package.',kind:'Adattato da Muro'}, {name:'Superpowers',symbol:'S',source:'obra / superpowers',version:'7.0.0',latest:'7.0.1',targets:['C','X','P'],state:'update',desc:'Workflow per progettare, implementare e verificare software.',kind:'Nativo + adattato'}, {name:'UI UX Pro Max',symbol:'U',source:'nextlevelbuilder / ui-ux-pro-max',version:'2.0.0',latest:'2.0.0',targets:['C','X','O'],state:'ok',desc:'Sistemi visuali, palette, tipografia e regole di accessibilità.',kind:'Nativo + adattato'}, {name:'Context7',symbol:'C7',source:'upstash / context7',version:'1.0.0',latest:'1.0.0',targets:['C','X','O'],state:'ok',desc:'Documentazione delle librerie nel contesto del progetto.',kind:'Nativo'}, {name:'Frontend Design',symbol:'F',source:'anthropics / skills',version:'a81c2e9',latest:'a81c2e9',targets:['C','X','P'],state:'ok',desc:'Progettazione e implementazione di interfacce curate.',kind:'Adattato da Muro'}, {name:'Research Tools',symbol:'R',source:'Il mio store / research',version:'—',latest:'1.2.0',targets:['H'],state:'missing',desc:'Il tuo set di strumenti per lettura e ricerca.',kind:'Adattato da Muro'}];
const harnesses=[['Claude Code','C','Shinatama · profilo personale','5 plugin','Nativo'],['Codex','X','Shinatama · profilo personale','5 plugin','Nativo'],['OpenCode','O','Installazione utente','3 plugin','Adapter Muro'],['Pi','P','Installazione utente','3 plugin','Adapter Muro'],['Hermes','H','Installazione utente','1 plugin','Adapter Muro'],['DeepSeek','D','Installazione utente','Non gestito','Adapter non disponibile']];
const navs=[['registry','box','Registry'],['harness','terminal','Harness'],['sync','sync','Sincronizzazione'],['activity','clock','Attività'],['maintenance','tool','Manutenzione'],['settings','settings','Impostazioni']];
const state=p=>p.state==='ok'?'<span class="badge good">Sincronizzato</span>':p.state==='update'?'<span class="badge warn">Aggiornamento</span>':'<span class="badge accent">Da installare</span>';
function notify(t){document.querySelector('#toast').textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4200)}
function go(p){page=p;render()}
function render(){document.querySelector('#workspace-icon').innerHTML=icon('grid');document.querySelector('#nav').innerHTML=navs.map(([id,i,label])=>`<button data-page="${id}" aria-label="${label}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(i)}<span class="nav-label">${label}</span>${id==='sync'&&!synced?'<span class="count">5</span>':''}</button>`).join('');document.querySelector('#main').innerHTML=page==='registry'?registry():page==='harness'?harness():page==='sync'?sync():page==='activity'?activity():page==='maintenance'?maintenance():settings();bind()}
function head(title,sub,action=''){return `<div class="breadcrumb">Workspace <span>/</span> ${title}</div><div class="header"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function registry(){return head('Il tuo registry','Scegli i plugin. Muro li tiene allineati, ovunque.',`<button class="btn primary" data-action="add">${icon('plus')} Aggiungi plugin</button>`)+`<div class="overview"><div class="metric"><div class="label">Plugin nel registry</div><div class="value">${plugins.length.toString().padStart(2,'0')}</div><small>Un’unica configurazione</small></div><div class="metric"><div class="label">Harness gestite</div><div class="value">05 <span style="font-size:13px;color:var(--muted)">/ 06</span></div><small>Rilevamento con Mukade</small></div><div class="metric"><div class="label">Aggiornamenti</div><div class="value warn">${plugins.filter(p=>p.state==='update').length.toString().padStart(2,'0')}</div><small>Ultime versioni stabili</small></div><div class="metric"><div class="label">Fuori registry</div><div class="value ${synced?'good':'bad'}">${synced?'00':'02'}</div><small>${synced?'Installazioni allineate':'Da rimuovere nel prossimo sync'}</small></div></div><div class="toolbar"><div class="tabs" aria-label="Filtro plugin">${[['all','Tutti'],['update','Da aggiornare'],['adapted','Adattati da Muro']].map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}" aria-pressed="${tab===k}">${v}</button>`).join('')}</div><label class="search">${icon('search')}<input id="search" aria-label="Cerca plugin" placeholder="Cerca plugin…" value="${esc(query)}"><kbd>/</kbd></label></div><div class="registry-layout"><div><div class="table-wrap"><table><thead><tr><th>Plugin / sorgente</th><th>Versione</th><th>Harness</th><th>Stato</th></tr></thead><tbody id="rows">${rows()}</tbody></table><div class="table-foot"><span>Versioni dimostrative · policy: ultima stabile</span><span>Registry locale</span></div></div><div class="notice"><span class="accent">${icon('shield')}</span><div><strong>Il registry decide cosa resta.</strong><p>Sync esclusivo ${exclusive?'attivo':'disattivato'} sulle 5 harness gestite.</p></div><button data-page="sync">Rivedi il piano →</button></div></div>${detail()}</div>`}
function rows(){return plugins.map((p,i)=>({p,i})).filter(({p})=>(p.name+' '+p.source).toLowerCase().includes(query.toLowerCase())&&(tab==='all'||tab==='update'&&p.state==='update'||tab==='adapted'&&p.kind!=='Nativo')).map(({p,i})=>`<tr class="${selected===i?'selected':''}"><td><button class="plugin-button" data-plugin="${i}" aria-label="Dettagli ${esc(p.name)}"><span class="plugin-symbol">${esc(p.symbol)}</span><span><strong>${esc(p.name)}</strong><small>${esc(p.source)}</small></span></button></td><td class="mono">${p.state==='update'?`<span class="muted">${p.version}</span><br><span class="accent">↳ ${p.latest}</span>`:esc(p.version)}</td><td><div class="targets">${p.targets.map(t=>`<span class="target" title="${harnesses.find(h=>h[1]===t)?.[0]||t}">${t}</span>`).join('')}</div></td><td>${state(p)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nessun plugin corrisponde al filtro.</td></tr>'}
function detail(){const p=plugins[selected];return `<aside class="detail" aria-label="Dettaglio plugin"><div class="detail-head"><div class="flex"><span class="plugin-symbol">${esc(p.symbol)}</span><div><h2>${esc(p.name)}</h2><small>Package nel registry</small></div></div></div><div class="detail-body"><p>${esc(p.desc)}</p><dl><dt>Distribuzione</dt><dd class="accent">${p.kind}</dd><dt>Aggiornamenti</dt><dd>Ultima stabile</dd><dt>Versione desiderata</dt><dd class="mono">${p.latest}</dd></dl><h3>Distribuzione per harness</h3>${p.targets.map(t=>{const h=harnesses.find(h=>h[1]===t);return `<div class="deployment"><span class="flex"><span class="target">${t}</span>${h[0]}</span><span class="${p.state==='ok'?'good':'warn'}">${p.state==='ok'?'Allineato':'In attesa'}</span></div>`}).join('')}<div style="margin-top:19px;border-top:1px solid var(--line);padding-top:17px"><div class="flex accent">${icon('branch')}<h3 style="margin:0">Un plugin, più destinazioni</h3></div><p style="margin-top:8px">Muro prepara l’adattamento quando manca una distribuzione nativa.</p></div><button class="btn" data-action="versions">Gestisci versioni ${icon('arrow')}</button></div></aside>`}
function harness(){return head('Harness','Le tue installazioni, rilevate tramite Mukade.',`<button class="btn" data-action="scan">${icon('sync')} Aggiorna inventario</button>`)+`<div class="harness-grid">${harnesses.map((h,i)=>`<article class="harness-card"><div class="flex between"><span class="plugin-symbol">${h[1]}</span><span class="badge ${i===5?'warn':'good'}">${i===5?'Supporto parziale':'Gestita'}</span></div><h2 style="margin-top:16px">${h[0]}</h2><small>${h[2]}</small><div class="mono">${i<2?'Shinatama / agents / '+h[0].toLowerCase().replace(' ','-'):'Profilo utente / '+h[0].toLowerCase()}</div><div class="flex between"><span class="muted" style="font-size:12px">${h[3]}</span><span class="badge">${h[4]}</span></div><button class="btn" data-harness="${i}">${i===5?'Vedi limitazione':'Configura destinazione'} ${icon('arrow')}</button></article>`).join('')}</div><div class="notice">${icon('terminal')}<p>Una harness può avere più istanze. Ogni profilo ha destinazioni e policy indipendenti.</p></div>`}
function sync(){return head('Sincronizzazione','Confronta il registry con le installazioni effettive.',`<span class="badge accent">${synced?'Simulazione completata':'Anteprima del piano'}</span>`)+`<section class="panel"><div class="flex between"><div><h2>Sync esclusivo</h2><p>Rimuovi dalle harness gestite i plugin che non sono nel registry.</p></div><input class="switch" id="exclusive" type="checkbox" aria-label="Sync esclusivo" ${exclusive?'checked':''}></div><small>Scope: i profili selezionati di Claude Code, Codex, OpenCode, Pi e Hermes.</small></section>${synced?'<div class="panel"><h2 class="good">Registry e installazioni allineati</h2><p>La simulazione è terminata. Nessun plugin reale è stato modificato.</p><button class="btn" data-action="reset">Ripristina dati demo</button></div>':`<div class="sync-summary"><span class="warn">2 aggiornamenti</span><span class="accent">1 installazione</span><span class="${exclusive?'bad':'muted'}">${exclusive?'2 rimozioni':'Plugin esterni conservati'}</span></div><div class="table-wrap"><table><thead><tr><th>Operazione</th><th>Plugin</th><th>Destinazione</th><th>Motivo</th></tr></thead><tbody><tr><td class="warn">Aggiorna</td><td>Marionette <span class="mono muted">0.2.0 → 0.3.0</span></td><td>5 harness</td><td>Nuova release · rigenera adapter</td></tr><tr><td class="warn">Aggiorna</td><td>Superpowers <span class="mono muted">7.0.0 → 7.0.1</span></td><td>3 harness</td><td>Ultima versione stabile</td></tr><tr><td class="accent">Installa</td><td>Research Tools</td><td>Hermes</td><td>Presente nel registry, assente sul target</td></tr>${exclusive?'<tr><td class="bad">Rimuovi</td><td>legacy-ui-kit</td><td>Claude Code</td><td>Non presente nel registry</td></tr><tr><td class="bad">Rimuovi</td><td>old-review-helper</td><td>Codex</td><td>Non presente nel registry</td></tr>':''}</tbody></table></div><div class="notice">${icon('shield')}<div><strong>Prima si preparano i nuovi package.</strong><p>Le rimozioni iniziano dopo che gli aggiornamenti del target sono pronti.</p></div></div><div class="sync-actions"><button class="btn" data-action="scan">${icon('sync')} Ricalcola piano</button><button class="btn primary" data-action="apply">${icon('check')} Simula sincronizzazione</button></div>`}`}
function activity(){return head('Attività','Il percorso di ogni operazione, dalla sorgente alla harness.')+`<div class="panel"><div class="section-label"><h2>Oggi <span class="muted" style="font-size:12px;font-weight:400">/ timeline dimostrativa</span></h2><span class="badge">Questo dispositivo</span></div><div class="timeline">${(synced?[['Adesso','Sincronizzazione simulata completata','Registry allineato alle 5 harness gestite.']]:[]).concat([['14:32','Piano di sincronizzazione pronto','Aggiornamenti, nuova installazione e plugin fuori registry.'],['14:31','Controllo delle release completato','Due aggiornamenti disponibili nelle sorgenti configurate.'],['14:30','Discovery Mukade completata','Sei istanze rilevate. Cinque destinazioni gestibili.']]).map(e=>`<article><small class="mono">${e[0]}</small><h3 style="margin-top:6px">${e[1]}</h3><small>${e[2]}</small></article>`).join('')}</div></div>`}
function maintenance(){return head('Manutenzione','Controlla e ripristina le installazioni gestite.')+`<div class="panel"><h2>Integrità dei plugin</h2><p>Confronta i file installati con gli artifact del registry.</p><button class="btn" data-action="integrity">${icon('shield')} Simula verifica</button></div><div class="panel"><h2>Reinstallazione</h2><p>Ripristina la versione registrata di un plugin sulle sue destinazioni.</p><div class="flex"><label for="repair">Plugin</label><select id="repair" style="padding:8px;background:var(--raised);color:var(--text);border:1px solid var(--line)">${plugins.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><button class="btn" data-action="repair">Simula reinstallazione</button></div></div><div class="panel"><h2>Artifact locali</h2><p>Il mockup mostra 3 versioni precedenti conservate per il recupero.</p><button class="btn" data-action="cache">Rivedi pulizia</button></div>`}
function settings(){return head('Impostazioni','Le regole del tuo registry e dei job di adattamento.')+`<div class="panel"><h2>Sincronizzazione</h2><div class="setting"><div><h3>Aggiornamento automatico</h3><p>Controlla le release ogni ora mentre Muro è aperto.</p></div><input id="auto" class="switch" type="checkbox" aria-label="Aggiornamento automatico" ${auto?'checked':''}></div><div class="setting"><div><h3>Modalità esclusiva</h3><p>Rimuovi i plugin non configurati dai target gestiti.</p></div><input id="exclusive" class="switch" type="checkbox" aria-label="Modalità esclusiva" ${exclusive?'checked':''}></div><p style="margin-top:16px">Preferenze valide solo in questa anteprima; si azzerano ricaricando la pagina.</p></div><div class="panel"><h2>Adattamento AI</h2><p>Quando manca una distribuzione, Muro usa l’agente scelto per intake e armonizzazione.</p><div class="setting"><label for="agent">Agente per gli adattamenti</label><select id="agent" style="padding:8px;background:var(--raised);color:var(--text)"><option>Claude Code · Shinatama</option>Codex · Shinatama</option></select></div><p>Nel mockup nessun agente viene avviato e non vengono consumati token.</p></div>`}
const modal=document.querySelector('#modal');
function openDialog(html){modal.innerHTML=html;modal.showModal();modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.close())}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-plugin]').forEach(b=>b.onclick=()=>{selected=+b.dataset.plugin;render()});document.querySelector('#search')?.addEventListener('input',e=>{query=e.target.value;document.querySelector('#rows').innerHTML=rows();document.querySelectorAll('[data-plugin]').forEach(b=>b.onclick=()=>{selected=+b.dataset.plugin;render()})});document.querySelector('#exclusive')?.addEventListener('change',e=>{exclusive=e.target.checked;render()});document.querySelector('#auto')?.addEventListener('change',e=>{auto=e.target.checked;notify('Preferenza aggiornata nel mockup')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-harness]').forEach(b=>b.onclick=()=>{let h=harnesses[+b.dataset.harness];openDialog(`<h2>${h[0]}</h2><p>${+b.dataset.harness===5?'Mukade rileva questa harness. Il catalogo attuale di Muro non include ancora il suo adapter plugin.':'Destinazione dimostrativa: '+h[2]+'. Il sync opera soltanto nel profilo selezionato.'}</p><div class="actions"><button class="btn" data-close>Chiudi</button></div>`)});}
function action(a){if(a==='add'){openDialog(`<h2>Aggiungi al registry</h2><p>Configura un plugin e le sue destinazioni. I dati restano in questo mockup.</p><form id="add-form"><label>Nome del plugin<input name="name" required maxlength="60" placeholder="Es. Il mio plugin"></label><label>Sorgente<input name="source" required maxlength="160" placeholder="Repository, marketplace o percorso"></label><label>Destinazione<select name="target">${harnesses.slice(0,5).map(h=>`<option value="${h[1]}">${h[0]}</option>`).join('')}</select></label><div class="actions"><button type="button" class="btn" data-close>Annulla</button><button class="btn primary">Aggiungi al mockup</button></div></form>`);document.querySelector('#add-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);plugins.push({name:f.get('name'),symbol:f.get('name').slice(0,1).toUpperCase(),source:f.get('source'),version:'—',latest:'Da risolvere',targets:[f.get('target')],state:'missing',desc:'Plugin aggiunto al registry dimostrativo.',kind:'Da verificare'});selected=plugins.length-1;query='';tab='all';modal.close();render();notify('Plugin aggiunto al mockup')};return}if(a==='versions'){const p=plugins[selected];openDialog(`<h2>Versioni · ${esc(p.name)}</h2><p>Upstream e adattamento restano tracciati separatamente.</p><div class="setting"><span>Installata</span><span class="mono">${p.version}</span></div><div class="setting"><span>Desiderata</span><span class="mono accent">${p.latest}</span></div><div class="setting"><span>Policy</span><span>Ultima stabile</span></div><p style="margin-top:16px">L’adattamento viene rigenerato e verificato prima della distribuzione.</p><div class="actions"><button class="btn" data-close>Chiudi</button><button class="btn primary" id="view-plan">Vedi piano</button></div>`);document.querySelector('#view-plan').onclick=()=>{modal.close();go('sync')};return}if(a==='apply'){openDialog(`<h2>Simula il sync</h2><p>Il mockup aggiornerà gli stati dei plugin.${exclusive?' Mostrerà anche la rimozione dei due plugin fuori registry.':''} Nessuna installazione reale verrà toccata.</p><div class="actions"><button class="btn" data-close>Annulla</button><button class="btn primary" id="confirm-sync">Avvia simulazione</button></div>`);document.querySelector('#confirm-sync').onclick=()=>{modal.close();plugins.forEach(p=>{p.version=p.latest;p.state='ok'});synced=true;render();notify('Simulazione completata. Nessuna modifica reale.')};return}if(a==='reset'){location.reload();return}if(a==='cache'){openDialog('<h2>Pulizia artifact</h2><p>3 versioni precedenti · 48 MB dimostrativi. Le versioni in uso restano conservate.</p><div class="actions"><button class="btn" data-close>Chiudi</button><button class="btn danger" id="clean">Simula pulizia</button></div>');document.querySelector('#clean').onclick=()=>{modal.close();notify('Pulizia simulata. Nessun file eliminato.')};return}notify(a==='scan'?'Inventario dimostrativo aggiornato. Nessuna scansione reale.':a==='integrity'?'Verifica simulata: nessuna anomalia nei dati demo.':'Reinstallazione simulata. Nessun processo avviato.')}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!modal.open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(page!=='registry')go('registry');document.querySelector('#search').focus()}});render();
</script></body></html>
